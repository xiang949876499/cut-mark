<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">cut-mark — text to editable video operations</title>
  <desc id="desc">A production board with a compact text brief, operation plan, timeline, and explicit capability states.</desc>
  <rect width="1200" height="360" rx="28" fill="#12120f"/>
  <path d="M54 75H1146" stroke="#504d37" stroke-width="2"/>
  <text x="58" y="64" fill="#ffd84a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">EDITING OPERATIONS / EXPLAINABLE OUTPUT</text>
  <text x="58" y="136" fill="#fff8dc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="60" font-weight="700">cut-mark</text>
  <text x="61" y="179" fill="#ddd5b6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="26">把教程文本变成可解释、可编辑的视频初稿</text>
  <text x="61" y="211" fill="#a9a186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21">Translate a brief into an operation plan, an editable project, and a render report.</text>
  <text x="61" y="258" fill="#ffd84a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">KDENLIVE · MLT · FFMPEG · COMFYUI</text>
