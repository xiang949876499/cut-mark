    <rect x="352" y="86" width="67" height="14" rx="3" fill="#d8d0b4"/><rect x="424" y="86" width="42" height="14" rx="3" fill="#ffd84a"/>
    <g font-size="13" font-weight="700">
      <rect x="0" y="159" width="144" height="35" rx="11" fill="#243722" stroke="#8fc56b"/><text x="42" y="182" fill="#dff7ca">EXACT</text>
