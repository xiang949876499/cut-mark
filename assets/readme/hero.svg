    <text x="171" y="43" fill="#fff8dc" font-size="16" font-weight="700">PLAN</text><text x="171" y="69" fill="#bfb697" font-size="13">trim · overlay</text><text x="171" y="91" fill="#bfb697" font-size="13">sync · render</text>
    <path d="M309 68H332" stroke="#ffd84a" stroke-width="4"/><polygon points="332,68 320,60 320,76" fill="#ffd84a"/>
